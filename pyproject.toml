[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "royal-glass-validator"
version = "0.1.0"
description = "Local foundation for the Royal Glass Phase 4 competitor validator"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
royal-glass-validator = "royal_glass_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
